name: Deploy website

on:
  push:
    branches: [main]
    paths: ['website/**', 'package.json', '.github/workflows/deploy-website.yml']
  pull_request:
    paths: ['website/**', '.github/workflows/deploy-website.yml']
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v6
        with:
          path: ./website

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
