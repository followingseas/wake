name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 공증용 API 키 복원
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"

      - name: 서명용 키체인 준비
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # electron-builder 가 스스로 만드는 키체인은 set-key-partition-list 에 키체인 비밀번호가
          # 아닌 값을 넘긴다(upstream #10101). 예전 macOS 는 그냥 넘어갔지만 2026-08-28 자 runner
          # 이미지부터 거부한다. 키체인을 직접 만들어 그 경로를 타지 않게 한다
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"

          # 여기서 넘기는 것이 키체인 자신의 비밀번호여야 한다
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          # codesign 이 찾을 수 있게 검색 목록에 넣는다. 기존 목록은 유지한다.
          # 출력은 따옴표로 감싼 들여쓴 경로라, 공백이 든 경로도 깨지지 않게 줄 단위로 읽는다
          EXISTING=()
          while IFS= read -r line; do
            line=$(printf '%s' "$line" | sed -E 's/^[[:space:]]*"?//; s/"?[[:space:]]*$//')
            if [ -n "$line" ]; then EXISTING+=("$line"); fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN" ${EXISTING[@]+"${EXISTING[@]}"}

          # electron-builder 는 "Developer ID Application:" 접두사를 뺀 이름만 받는다.
          # 매치된 줄만 출력해, 형식이 다르면 빈 값이 되어 아래 검사에 걸리게 한다
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n -E 's/.*"Developer ID Application: (.+)"$/\1/p' | head -1)
          if [ -z "$IDENTITY" ]; then
            echo "::error::키체인에서 Developer ID Application 인증서를 찾지 못했다"
            exit 1
          fi

          # CSC_LINK 를 그대로 두면 electron-builder 가 다시 자기 키체인을 만든다. 여기서 끊는다
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "CSC_NAME=$IDENTITY" >> "$GITHUB_ENV"

      - name: 빌드·서명·공증 후 draft 릴리스 업로드
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run build:mac -- --publish always

      - name: 자격증명 정리
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
